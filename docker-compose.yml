version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: class-treasurer-app
    working_dir: /var/www/html
    ports:
      - "8000:8000" # PHP dev server
    volumes:
      - ./:/var/www/html
      - composer-cache:/tmp/composer-cache
    environment:
      # Laravel defaults
      APP_ENV: local
      APP_DEBUG: "true"
      LOG_CHANNEL: stderr
      LOG_LEVEL: debug
      # Use MySQL by default in Docker
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: class_treasurer
      DB_USERNAME: laravel
      DB_PASSWORD: secret
    command: >-
      bash -lc "\
      composer install --no-interaction --prefer-dist --no-progress --ansi --working-dir=/var/www/html --no-scripts && \
      if [ ! -f .env ]; then cp .env.example .env; fi && \
      php artisan key:generate --force && \
      php artisan migrate --force --no-interaction || true && \
      php artisan serve --host 0.0.0.0 --port 8000"
    depends_on:
      node:
        condition: service_started
      mysql:
        condition: service_healthy

  node:
    image: node:22-alpine
    container_name: class-treasurer-node
    working_dir: /app
    ports:
      - "5173:5173" # Vite HMR
    volumes:
      - ./:/app
      - node-modules:/app/node_modules
    environment:
      # Fixes many file watching issues on mounted volumes
      CHOKIDAR_USEPOLLING: "true"
      VITE_HOST: 0.0.0.0
    command: >-
      sh -lc "\
      npm install && \
      npm run dev -- --host 0.0.0.0 --port 5173"

  mysql:
    image: mysql:8.4
    container_name: class-treasurer-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: class_treasurer
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  composer-cache: {}
  node-modules: {}
  mysql-data: {}
